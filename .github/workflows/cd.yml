name: BrewLite CD Pipeline (Task 5.3)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/api
  IMAGE_WEB: ghcr.io/${{ github.repository }}/web
  PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
  RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
  RENDER_WEB_DEPLOY_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
  RENDER_ROLLBACK_HOOK: ${{ secrets.RENDER_ROLLBACK_HOOK }}

jobs:
  cd-delivery:
    name: Quality Gate -> Docker -> GHCR -> Deploy -> Smoke Test -> Rollback
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: 3. Quality Gate (Pre-deploy Verification)
        run: |
          echo "Verifying build and quality requirements..."
          cd apps/api
          npm ci
          npx prisma generate
          npx tsc --noEmit
          npm run test -- --runInBand
          npm run build
          cd ../web
          npm ci
          npm run build

      - name: 4. Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 5. Extract Git Commit Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 6. Build and Push API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest

      - name: 7. Build and Push Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
            ${{ env.IMAGE_WEB }}:latest

      - name: 8. Trigger Production Deploy & Run Prisma Migration
        id: deploy
        if: ${{ env.RENDER_API_DEPLOY_HOOK != '' || env.RENDER_WEB_DEPLOY_HOOK != '' }}
        run: |
          if [ -n "$RENDER_API_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --retry 3 --max-time 30 \
              -X POST "$RENDER_API_DEPLOY_HOOK"
          fi
          if [ -n "$RENDER_WEB_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --retry 3 --max-time 30 \
              -X POST "$RENDER_WEB_DEPLOY_HOOK"
          fi

      - name: 9. Automated Smoke Test (GET /health)
        id: smoke_test
        if: ${{ env.PRODUCTION_API_URL != '' && steps.deploy.outcome == 'success' }}
        run: |
          echo "Testing target: ${PRODUCTION_API_URL}/health"
          curl --fail --silent --show-error --retry 10 --retry-delay 5 \
            --max-time 15 "${PRODUCTION_API_URL}/health"

      - name: 10. Automated Rollback on Smoke Test Failure
        if: ${{ failure() && steps.deploy.outcome == 'success' && env.RENDER_ROLLBACK_HOOK != '' }}
        run: |
          echo "::error::Smoke test failed; triggering rollback."
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            -X POST "$RENDER_ROLLBACK_HOOK"
