name: BrewLite CI Pipeline (Task 4.4)

on:
  push:
    branches: [ main, develop, 'feat/**', 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci-quality-gate:
    name: Install -> Lint -> Unit Test -> Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: brewlite_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: 3. Install Dependencies (apps/api)
        working-directory: ./apps/api
        run: npm ci

      - name: 4. Install Dependencies (apps/web)
        working-directory: ./apps/web
        run: npm ci

      - name: 5. Generate Prisma Client
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://brewlite:secret@localhost:5432/brewlite_test_db?schema=public
        run: npx prisma generate

      - name: 6. Static Type Check (Backend)
        working-directory: ./apps/api
        run: npx tsc --noEmit

      - name: 7. Static Type Check (Frontend)
        working-directory: ./apps/web
        run: npx tsc --noEmit

      - name: 8. Run Unit & Integration Tests
        run: |
          cd apps/api
          npm run test -- --runInBand

      - name: 9. Build Applications (Production Gate)
        env:
          DATABASE_URL: postgresql://brewlite:secret@localhost:5432/brewlite_test_db?schema=public
          JWT_SECRET: test_jwt_secret_key_12345
        run: |
          cd apps/api && npm run build
          cd ../web && npm run build
